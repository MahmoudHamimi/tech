<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tech · Workbench &amp; Orrery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0b1119; --bar: #101a26; --line: #22344a; --fg: #e2e8f4; --mut: #8493ad;
    --truss: #5cb5ea; --orrery: #ffb347;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 12.5px var(--mono); display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px));
    padding-top: max(8px, env(safe-area-inset-top, 0px));
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font: 600 17px var(--display); letter-spacing: .18em; text-transform: uppercase; }
  h1 span { color: var(--mut); font-weight: 500; }

  nav { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  nav button {
    font: 600 13px var(--display); letter-spacing: .14em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 0; padding: 9px 16px; min-height: 38px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  nav button + button { border-left: 1px solid var(--line); }
  nav button:hover { background: rgba(255,255,255,.06); }
  nav button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  nav button[aria-selected="true"] { background: var(--c); color: #06101a; }
  nav button[aria-selected="true"] i { background: #06101a; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .open { margin-left: auto; color: var(--mut); text-decoration: none; font-size: 11.5px; }
  .open:hover { color: var(--fg); }

  main { position: relative; flex: 1; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  iframe[hidden] { display: none; }

  @media (max-width: 520px) { h1 { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Tech <span>/</span> Apps</h1>
  <nav role="tablist" aria-label="Choose an app">
    <button role="tab" id="tab-truss" aria-controls="truss" data-app="truss" style="--c: var(--truss)"><i></i>Truss Workbench</button>
    <button role="tab" id="tab-orrery" aria-controls="orrery" data-app="orrery" style="--c: var(--orrery)"><i></i>Earth·Moon·Sun Orrery</button>
  </nav>
  <a class="open" id="open" target="_blank" rel="noopener">Open in new tab ↗</a>
</header>

<main>
  <iframe id="truss" role="tabpanel" aria-labelledby="tab-truss" title="Truss Workbench" data-src="truss/index.html" hidden></iframe>
  <iframe id="orrery" role="tabpanel" aria-labelledby="tab-orrery" title="Earth–Moon–Sun Orrery" data-src="orrery/index.html" hidden></iframe>
</main>

<script>
  // Each app loads on first open and then stays alive, so switching back keeps its state.
  const apps = ['truss', 'orrery'];
  const tabs = document.querySelectorAll('nav button');
  const openLink = document.getElementById('open');

  function show(app) {
    if (!apps.includes(app)) app = apps[0];
    tabs.forEach(b => {
      const on = b.dataset.app === app;
      b.setAttribute('aria-selected', on);
      b.tabIndex = on ? 0 : -1;
    });
    apps.forEach(id => {
      const f = document.getElementById(id);
      if (id === app && !f.src) f.src = f.dataset.src;
      f.hidden = id !== app;
    });
    openLink.href = document.getElementById(app).dataset.src;
    if (location.hash !== '#' + app) history.replaceState(null, '', '#' + app);
  }

  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.app)));
  document.querySelector('nav').addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const i = [...tabs].findIndex(b => b.getAttribute('aria-selected') === 'true');
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.focus(); show(next.dataset.app);
  });
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
