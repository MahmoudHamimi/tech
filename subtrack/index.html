<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubTrack Pro — Subscription Manager</title>
<script>
/* Apply the saved theme before first paint to avoid a flash */
try{var p=localStorage.getItem('subtrack_theme')||'system';
document.documentElement.dataset.theme=p==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p}catch(e){}
</script>
<style>
:root,[data-theme=light]{
  color-scheme:light;
  --bg:#f5f6fa;--surface:#ffffff;--surface-2:#f3f4f9;--ink:#171a2b;--muted:#667087;--line:#e4e6ef;--line-strong:#d2d6e3;
  --accent:#5b4bdb;--accent-ink:#ffffff;--accent-soft:#eeebff;
  --good:#0f7a54;--good-soft:#e2f4ea;--warn:#8f5600;--warn-soft:#fff0d3;--bad:#b3322d;--bad-soft:#fde8e7;
  --shadow:0 1px 2px rgba(20,24,50,.05),0 6px 20px rgba(20,24,50,.05);
  --cat-1:#2a78d6;--cat-2:#eb6834;--cat-3:#1baf7a;--cat-4:#eda100;--cat-5:#e87ba4;--cat-6:#008300;--cat-7:#6250d6;--cat-8:#e34948;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0e1016;--surface:#161923;--surface-2:#1d212d;--ink:#eceef7;--muted:#98a0b8;--line:#272c3a;--line-strong:#383e52;
  --accent:#8c7fff;--accent-ink:#0e0e1a;--accent-soft:#26224d;
  --good:#4cc79a;--good-soft:#12302a;--warn:#f0b44c;--warn-soft:#352a10;--bad:#f2837d;--bad-soft:#391b1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  --cat-1:#3987e5;--cat-2:#d95926;--cat-3:#199e70;--cat-4:#c98500;--cat-5:#d55181;--cat-6:#008300;--cat-7:#9085e9;--cat-8:#e66767;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{flex-shrink:0;display:block}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;transition:background-color .25s}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.3px;padding:4px 8px 22px}
.brand b{color:var(--accent)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.navlabel{font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:16px 10px 7px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:10px 11px;border-radius:10px;color:var(--muted);margin:2px 0;font-weight:550}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sidefoot{margin-top:auto}
.wsbox{border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;gap:8px;background:var(--surface-2)}
.wsname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{padding:28px 32px 40px;max-width:1320px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.crumb{font-size:10.5px;color:var(--muted);letter-spacing:1.1px;font-weight:600}
.top h1{font-size:26px;letter-spacing:-.5px;margin:4px 0 3px}
.top-actions{display:flex;gap:8px;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:9px;color:var(--muted);transition:background-color .15s,color .15s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.danger:hover{background:var(--bad-soft);color:var(--bad)}
.ib.good:hover{background:var(--good-soft);color:var(--good)}
.ib.lg{width:38px;height:38px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:10px}
input,select,textarea{border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--surface);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--accent);cursor:pointer}
textarea{resize:vertical;min-height:70px}
.searchbox{position:relative;min-width:220px}
.searchbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-left:35px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{width:auto}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- cards & panels ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card,.panel,.plan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);transition:background-color .25s,border-color .25s}
.metric-label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.metric{font-size:28px;font-weight:800;margin:9px 0 3px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.metric-foot{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:16px}
.grid2.even{grid-template-columns:1fr 1fr}
.panel{margin-bottom:16px}
.grid2 .panel{margin-bottom:0}
.panel h2{font-size:15px;letter-spacing:-.1px}
.panelhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stack{display:grid;gap:14px}

/* ---------- banner ---------- */
.banner{display:flex;gap:13px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px;padding:13px 16px;margin-bottom:18px}
.banner .bi{color:var(--accent);margin-top:1px}
.banner p{flex:1;font-size:13px;line-height:1.55}
.banner p b{font-weight:700}
.banner .btn{align-self:center}

/* ---------- tags / pills ---------- */
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:7px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:20px;background:var(--good-soft);color:var(--good)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted)}

/* ---------- service cell ---------- */
.svc{display:flex;align-items:center;gap:11px;min-width:0}
.sicon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;flex-shrink:0;background:color-mix(in srgb,var(--cat) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--cat) 38%,transparent)}
.sname{display:grid;min-width:0}
.sname b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small,td small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11px;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background-color .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.sel{background:var(--accent-soft)}
tr.dim .sname b,tr.dim td:not(.c-act){opacity:.62}
.c-chk{width:34px}
.c-act{text-align:right;white-space:nowrap;width:1%}
.c-act .acts{display:inline-flex;gap:1px}
td b{font-variant-numeric:tabular-nums}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:8px 12px;border-radius:12px;margin-bottom:12px}
.bulk b{margin-right:auto;font-size:13px}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin:12px 0 5px}
.empty p{max-width:380px;margin:0 auto 16px;font-size:13px}
.empty .eico{width:56px;height:56px;border-radius:16px;margin:auto;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- lists ---------- */
.upcoming{display:grid;gap:4px}
.upitem{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:11px;cursor:pointer}
.upitem:hover{background:var(--surface-2)}
.upitem .svc{flex:1}
.upitem .info small{display:block;color:var(--muted);font-size:11.5px}
.upitem .info small.soon{color:var(--warn);font-weight:600}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;display:flex;gap:11px;align-items:flex-start}
.note .ico{margin-top:2px;color:var(--muted)}
.note.good .ico{color:var(--good)}.note.warn .ico{color:var(--warn)}.note.bad .ico{color:var(--bad)}.note.info .ico{color:var(--accent)}
.grouphead{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin:14px 0 6px}
.grouphead:first-child{margin-top:0}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.datebox{width:42px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;flex-shrink:0;background:var(--surface-2)}
.datebox small{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.datebox b{font-size:16px;line-height:1.1}
.rrow .info{flex:1;min-width:0}
.rrow .info small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- charts ---------- */
.bars{display:flex;gap:12px;height:250px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:default}
.bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.bar{width:100%;max-width:46px;background:var(--accent);border-radius:5px 5px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1),opacity .15s;opacity:.92}
.bcol:hover .bar{opacity:1;filter:brightness(1.1)}
.bval{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.blab{font-size:11.5px;color:var(--muted)}
.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:190px;height:190px;flex-shrink:0}
.donut circle[data-tip]{transition:opacity .15s}
.donut circle[data-tip]:hover{opacity:.8}
.dtot{font-size:20px;font-weight:800;fill:var(--ink)}
.dsub{font-size:9.5px;fill:var(--muted)}
.legend{flex:1;min-width:200px;display:grid;gap:9px}
.lg{display:flex;align-items:center;gap:9px;font-size:13px}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--cat);flex-shrink:0}
.lg span{flex:1}
.lg em{font-style:normal;color:var(--muted);font-size:12px;width:38px;text-align:right}
.lg b{font-variant-numeric:tabular-nums}
.hbar{display:grid;gap:5px;margin:13px 0}
.hbar .h{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.hbar .track{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.hbar .fill{height:100%;border-radius:8px;background:var(--cat,var(--accent));min-width:3px}
.prog{height:10px;background:var(--surface-2);border-radius:10px;overflow:hidden;margin:10px 0 8px}
.prog>div{height:100%;border-radius:10px;transition:width .5s}
.prog.good>div{background:var(--good)}.prog.warn>div{background:var(--warn)}.prog.bad>div{background:var(--bad)}
.budgetrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.calhead h2{min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.day{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.day.out{background:transparent;border-color:transparent}
.day.has{background:var(--surface-2)}
.day.today{border-color:var(--accent)}
.day .n{font-size:12px;font-weight:650;color:var(--muted)}
.day.today .n{color:var(--accent);font-weight:800}
.chip{font-size:10.5px;line-height:1.25;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--cat) 20%,var(--surface));border-left:3px solid var(--cat);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:10.5px;color:var(--muted)}

/* ---------- plans ---------- */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan.featured{border:2px solid var(--accent)}
.plan{display:flex;flex-direction:column}
.price{font-size:32px;font-weight:800;margin:12px 0;letter-spacing:-1px}
.plan ul{padding:0;margin:14px 0 20px;list-style:none;display:grid;gap:9px;font-size:13px;flex:1}
.plan li{display:flex;gap:9px;align-items:center}.plan li .ico{color:var(--good)}
.plan .btn{width:100%}
.badge{font-size:10.5px;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:20px;font-weight:700;margin-left:6px}
.notice{background:var(--accent-soft);padding:13px 15px;border-radius:12px;font-size:12.5px;line-height:1.6;margin-top:16px;display:flex;gap:10px}
.notice .ico{color:var(--accent);margin-top:2px}

/* ---------- settings ---------- */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px;align-content:start}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:650}
.field .hint{font-size:11.5px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.settings{max-width:680px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drow:last-child{border-bottom:0;padding-bottom:0}
.drow p{font-size:12.5px;color:var(--muted);margin-top:2px;max-width:380px}

/* ---------- modal ---------- */
.modalback{position:fixed;inset:0;background:rgba(8,10,22,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);padding:22px;border-radius:18px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s cubic-bezier(.2,.9,.3,1.1)}
.modal h2{font-size:18px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px}
.modalfoot .r{display:flex;gap:8px;margin-left:auto}
.preview{grid-column:1/-1;background:var(--surface-2);border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--muted)}
.preview b{color:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* ---------- toast / tooltip ---------- */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px 11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;font-size:13px;font-weight:550}
.toast button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:2px 4px;border-radius:5px;opacity:.95}
#tip{position:fixed;display:none;z-index:70;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:12px;pointer-events:none;max-width:260px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip b{display:block}
.mobile{display:none}

/* ---------- responsive ---------- */
@media(max-width:1000px){.c-owner{display:none}.grid2,.grid2.even{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
  .app{grid-template-columns:1fr}.side{display:none}.main{padding:18px 14px 96px}
  .plans{grid-template-columns:1fr}.cards.c3{grid-template-columns:1fr}
  .mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .mobile button{border:0;background:none;font-size:10.5px;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:5px 8px;border-radius:9px;font-weight:600}
  .mobile button.active{color:var(--accent)}
  #toasts{bottom:78px}
  .top h1{font-size:22px}
}
@media(max-width:640px){
  .day{min-height:52px;padding:4px}.chip{font-size:0;padding:0;height:6px;border-left:0;background:var(--cat);border-radius:4px}
  .dow{font-size:9.5px}.more{font-size:9.5px}
  .hide-sm{display:none}.searchbox{flex:1 1 100%}.toolbar select{flex:1}
  .c-next{display:none}
}
@media(max-width:520px){
  .formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.metric{font-size:23px}.cards{gap:10px}.card{padding:14px}
  .modalback{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;width:100%;max-height:94vh}
  .banner{flex-wrap:wrap}.banner .btn{width:100%}
  .donut{margin:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top">
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
      <div class="top-actions">
        <button class="ib lg" id="themebtn" data-act="theme-toggle" aria-label="Switch between light and dark mode" title="Switch light / dark"></button>
        <button class="btn" id="export" data-act="export-csv" title="Download all subscriptions as CSV"></button>
        <button class="btn primary" id="add" data-act="add" title="Add subscription (N)"></button>
      </div>
    </header>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<nav class="mobile" id="mnav"></nav>
<div id="modal"></div><div id="toasts" role="status" aria-live="polite"></div><div id="tip"></div>
<input type="file" id="file" accept=".json,.csv,application/json,text/csv" hidden>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);

/* ================= constants ================= */
const CATS=['Productivity','Marketing','Cloud','Design','Finance','Development','Communication','Other'];
const STATUSES=['Active','Paused','Cancelled'];
const CYCLES={weekly:{label:'Weekly',m:52/12,mo:0},monthly:{label:'Monthly',m:1,mo:1},quarterly:{label:'Quarterly',m:1/3,mo:3},yearly:{label:'Yearly',m:1/12,mo:12}};
const CURRENCIES=['USD','EUR','GBP','EGP','SAR','AED','CAD','AUD','INR','JPY','CHF'];
const KNOWN={Slack:'Communication',Zoom:'Communication','Microsoft Teams':'Communication',Notion:'Productivity','Google Workspace':'Productivity','Microsoft 365':'Productivity',Dropbox:'Productivity',Asana:'Productivity',Trello:'Productivity','Adobe Creative Cloud':'Design',Figma:'Design',Canva:'Design',AWS:'Cloud','Google Cloud':'Cloud',Azure:'Cloud',DigitalOcean:'Cloud',Vercel:'Cloud',GitHub:'Development',GitLab:'Development',Jira:'Development',Sentry:'Development',HubSpot:'Marketing',Mailchimp:'Marketing',Semrush:'Marketing',QuickBooks:'Finance',Xero:'Finance'};
const KEY='subtrack_v2';
const ci=c=>{const i=CATS.indexOf(c);return i<0?8:i+1};

/* ================= icons ================= */
const I={
grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
download:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
upload:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
trash:'<path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
check:'<path d="M20 6L9 17l-5-5"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
alert:'<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/>',
left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',
flask:'<path d="M9 3h6M10 3v6L4 19a2 2 0 001.7 3h12.6A2 2 0 0020 19l-6-10V3"/>',
loop:'<path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>',
pause:'<path d="M8 4v16M16 4v16"/>',play:'<path d="M6 4l14 8-14 8z"/>',ban:'<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/>',
tip:'<path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/>',
wallet:'<path d="M20 7H5a2 2 0 010-4h13v4zM3 5v14a2 2 0 002 2h15V7"/><circle cx="16.5" cy="14" r="1"/>'
};
const ico=(n,s=16)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;

/* ================= date helpers (local time) ================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T12:00:00');
const todayS=()=>ymd(new Date());
const dd=s=>Math.round((pd(s)-pd(todayS()))/864e5);
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const shift=(s,cycle,k)=>cycle==='weekly'?addDays(s,7*k):addMonths(s,CYCLES[cycle].mo*k);
const dfmt=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const rel=s=>{const d=dd(s);return d===0?'Today':d===1?'Tomorrow':d===-1?'Yesterday':d<0?`${-d} days ago`:`in ${d} days`};
function occ(s,from,to){const out=[];for(let k=0;k<3000;k++){const x=shift(s.next,s.cycle,k);if(x>to)break;if(x>=from)out.push(x)}return out}

/* ================= state ================= */
const DEFAULTS={workspace:'My Company',currency:'USD',budget:1000,remind:7};
const sampleData=()=>[
['Slack','Communication',80,'monthly',2,'Operations','Active'],
['Adobe Creative Cloud','Design',60,'monthly',5,'Design','Active'],
['GitHub','Development',44,'monthly',4,'Engineering','Active'],
['Zoom','Communication',45,'monthly',7,'Operations','Active'],
['Notion','Productivity',24,'monthly',9,'Operations','Active'],
['AWS','Cloud',350,'monthly',12,'Engineering','Active'],
['Google Workspace','Productivity',72,'monthly',15,'All teams','Active'],
['HubSpot','Marketing',120,'monthly',19,'Marketing','Active'],
['Figma','Design',45,'monthly',24,'Design','Active'],
['QuickBooks','Finance',90,'quarterly',33,'Finance','Active'],
['Canva','Design',120,'yearly',210,'Marketing','Active'],
['Mailchimp','Marketing',35,'monthly',11,'Marketing','Paused'],
['Dropbox','Productivity',15,'monthly',3,'Operations','Cancelled']
].map((x,i)=>({id:i+1,name:x[0],category:x[1],amount:x[2],cycle:x[3],next:addDays(todayS(),x[4]),owner:x[5],status:x[6],notes:'',sample:true}));

let state=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.subs))return{subs:r.subs,settings:{...DEFAULTS,...(r.settings||{})}}}catch(e){}
return{subs:sampleData(),settings:{...DEFAULTS}}})();
const S=()=>state.settings;
let ui={view:'dashboard',q:'',cat:'all',status:'all',sort:'next',range:30,cal:(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})()};
const sel=new Set();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const newId=()=>Math.max(0,...state.subs.map(x=>x.id))+1;

/* keep renewal dates in the future: roll past dates forward by billing cycle */
function roll(){let ch=false;state.subs.forEach(s=>{if(s.status==='Active'&&dd(s.next)<0){const base=s.next;let k=1;while(k<5000&&dd(shift(base,s.cycle,k))<0)k++;s.next=shift(base,s.cycle,k);ch=true}});if(ch)persist()}

/* ================= derived data ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const whole=Math.abs(n-Math.round(n))<.005,d=whole?0:2;try{return new Intl.NumberFormat('en-US',{style:'currency',currency:S().currency,minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}catch(e){return S().currency+' '+n.toFixed(d)}};
const act=()=>state.subs.filter(s=>s.status==='Active');
const mon=s=>s.amount*CYCLES[s.cycle].m;
const mSum=l=>l.reduce((n,s)=>n+mon(s),0);
const byNext=(a,b)=>a.next.localeCompare(b.next)||a.name.localeCompare(b.name);
const dueSoon=()=>act().filter(s=>{const d=dd(s.next);return d>=0&&d<=S().remind}).sort(byNext);
const sampleCount=()=>state.subs.filter(s=>s.sample).length;
const find=id=>state.subs.find(s=>s.id===id);
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};

/* ================= undo-able changes ================= */
function commit(msg,fn,{silent=false}={}){const snap=JSON.stringify(state.subs);fn();persist();render();
  if(!silent)toast(msg,{label:'Undo',fn:()=>{state.subs=JSON.parse(snap);persist();render();toast('Change undone')}})}
function toast(msg,action){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();el.remove()};el.appendChild(b)}
  $('toasts').appendChild(el);setTimeout(()=>el.remove(),action?7000:2800)}

/* ================= theme ================= */
const mq=matchMedia('(prefers-color-scheme: dark)');
const themePref=()=>{try{return localStorage.getItem('subtrack_theme')||'system'}catch(e){return'system'}};
function applyTheme(){const p=themePref(),t=p==='system'?(mq.matches?'dark':'light'):p;document.documentElement.dataset.theme=t;$('themebtn').innerHTML=ico(t==='dark'?'sun':'moon',18)}
function setTheme(p){try{localStorage.setItem('subtrack_theme',p)}catch(e){}applyTheme();if(ui.view==='settings')render()}
mq.addEventListener&&mq.addEventListener('change',()=>{if(themePref()==='system')applyTheme()});

/* ================= small view helpers ================= */
const svc=s=>`<div class="svc"><span class="sicon" style="--cat:var(--cat-${ci(s.category)})">${esc((s.name[0]||'?').toUpperCase())}</span><span class="sname"><b>${esc(s.name)}${s.sample?'<span class="tag" title="Example data">Sample</span>':''}</b><small>${esc(s.category)}</small></span></div>`;
function pill(s){if(s.status==='Cancelled')return'<span class="pill bad">Cancelled</span>';if(s.status==='Paused')return'<span class="pill mute">Paused</span>';const d=dd(s.next);return d===0?'<span class="pill warn">Due today</span>':d<=S().remind?'<span class="pill warn">Due soon</span>':'<span class="pill">Active</span>'}
const card=(label,val,foot,ic)=>`<div class="card"><div class="metric-label">${ic?ico(ic,15):''}${label}</div><div class="metric">${val}</div><div class="metric-foot">${foot}</div></div>`;
const note=(tone,ic,txt)=>`<div class="note ${tone}">${ico(ic,16)}<div>${txt}</div></div>`;
const hbars=(items,max)=>items.map(i=>`<div class="hbar"><div class="h"><span>${esc(i.label)}</span><b>${i.val}</b></div><div class="track"><div class="fill" style="width:${max?i.v/max*100:0}%;${i.cat?`--cat:var(--cat-${i.cat})`:''}"></div></div></div>`).join('');

function emptyAll(){return `<div class="empty"><div class="eico">${ico('list',26)}</div><h3>No subscriptions yet</h3><p>Add your first subscription to start tracking your recurring spend and upcoming renewals.</p><div class="row"><button class="btn primary" data-act="add">${ico('plus')}Add subscription</button><button class="btn" data-act="restore-sample">${ico('flask')}Load sample data</button></div></div>`}

function table(list,{select=true}={}){
  if(!state.subs.length)return emptyAll();
  if(!list.length)return `<div class="empty"><div class="eico">${ico('search',26)}</div><h3>No matching subscriptions</h3><p>Try a different search or clear your filters.</p><button class="btn" data-act="clear-filters">Clear filters</button></div>`;
  const all=list.every(s=>sel.has(s.id));
  return `<div class="tablewrap"><table><thead><tr>${select?`<th class="c-chk"><input type="checkbox" data-chkall ${all?'checked':''} aria-label="Select all"></th>`:''}<th>Service</th><th class="c-owner">Owner</th><th>Cost</th><th class="c-next">Next payment</th><th>Status</th><th class="c-act"><span class="hide-sm"> </span></th></tr></thead><tbody>${list.map(s=>{
    const inactive=s.status!=='Active';
    return `<tr data-row="${s.id}" class="${sel.has(s.id)?'sel':''} ${inactive?'dim':''}">${select?`<td class="c-chk"><input type="checkbox" data-chk="${s.id}" ${sel.has(s.id)?'checked':''} aria-label="Select ${esc(s.name)}"></td>`:''}<td>${svc(s)}</td><td class="c-owner">${esc(s.owner)||'<span class="muted">—</span>'}</td><td><b>${fmt(s.amount)}</b><small>${CYCLES[s.cycle].label}${s.cycle!=='monthly'?` · ≈ ${fmt(mon(s))}/mo`:''}</small></td><td class="c-next">${inactive?'<span class="muted">—</span>':`${dfmt(s.next)}<small>${rel(s.next)}</small>`}</td><td>${pill(s)}</td><td class="c-act"><div class="acts"><button class="ib" data-act="edit" data-id="${s.id}" title="Edit" aria-label="Edit ${esc(s.name)}">${ico('edit')}</button><button class="ib" data-act="dup" data-id="${s.id}" title="Duplicate" aria-label="Duplicate ${esc(s.name)}">${ico('copy')}</button><button class="ib danger" data-act="del" data-id="${s.id}" title="Delete" aria-label="Delete ${esc(s.name)}">${ico('trash')}</button></div></td></tr>`}).join('')}</tbody></table></div>`}

function upRow(s){return `<div class="upitem" data-act="edit" data-id="${s.id}">${svc(s).replace(/<small>.*?<\/small>/,'')}<div style="text-align:right;white-space:nowrap"><div class="amt">${fmt(s.amount)}</div><small class="${dd(s.next)<=S().remind?'soon':'muted'}" style="font-size:11.5px;${dd(s.next)<=S().remind?'color:var(--warn);font-weight:600':''}">${rel(s.next)}</small></div><button class="ib good" data-act="paid" data-id="${s.id}" title="Mark as paid (moves to next cycle)" aria-label="Mark ${esc(s.name)} as paid">${ico('check')}</button></div>`}

/* ================= charts ================= */
function projection(){const t=new Date(),out=[];for(let i=0;i<6;i++){const st=new Date(t.getFullYear(),t.getMonth()+i,1),en=new Date(t.getFullYear(),t.getMonth()+i+1,0);const from=i===0?todayS():ymd(st),to=ymd(en);let tot=0,n=0;act().forEach(s=>occ(s,from,to).forEach(()=>{tot+=s.amount;n++}));out.push({label:st.toLocaleDateString('en-US',{month:'short'}),full:st.toLocaleDateString('en-US',{month:'long',year:'numeric'}),tot,n})}return out}
function barsChart(p){const mx=Math.max(1,...p.map(x=>x.tot));return `<div class="bars" role="img" aria-label="Scheduled payments for the next six months">${p.map((x,i)=>`<div class="bcol" data-tip="${esc(x.full+(i===0?' (from today)':'')+'|'+fmt(x.tot)+' · '+x.n+' payment'+(x.n===1?'':'s'))}"><span class="bval">${x.tot?fmt(x.tot):'–'}</span><div class="bwrap"><div class="bar" style="height:${x.tot/mx*100}%"></div></div><span class="blab">${x.label}</span></div>`).join('')}</div>`}
function catEntries(){const c={};act().forEach(s=>c[s.category]=(c[s.category]||0)+mon(s));return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function donut(entries,total){const R=70,C=2*Math.PI*R;let off=0;const segs=entries.map(([k,v])=>{const len=v/total*C,gap=entries.length>1?2.5:0;const el=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--cat-${ci(k)})" stroke-width="22" stroke-dasharray="${Math.max(.1,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" data-tip="${esc(k+'|'+fmt(v)+'/month · '+Math.round(v/total*100)+'%')}"/>`;off+=len;return el}).join('');
  return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="Spending by category"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--line)" stroke-width="22"/>${segs}<text x="90" y="88" text-anchor="middle" class="dtot">${fmt(total)}</text><text x="90" y="105" text-anchor="middle" class="dsub">per month</text></svg>`}
function catPanelBody(){const e=catEntries(),t=e.reduce((n,x)=>n+x[1],0);if(!t)return'<div class="empty" style="padding:24px">No active subscriptions to chart yet.</div>';
  return `<div class="donutwrap">${donut(e,t)}<div class="legend">${e.map(([k,v])=>`<div class="lg" style="--cat:var(--cat-${ci(k)})"><i></i><span>${esc(k)}</span><b>${fmt(v)}</b><em>${Math.round(v/t*100)}%</em></div>`).join('')}</div></div>`}

/* ================= views ================= */
const V={};
V.dashboard=()=>{
  const a=act(),sum=mSum(a),due=dueSoon(),dueAmt=due.reduce((n,s)=>n+s.amount,0),paused=state.subs.filter(s=>s.status==='Paused').length,canc=state.subs.filter(s=>s.status==='Cancelled').length;
  const b=S().budget,pct=b>0?sum/b*100:0,tone=pct>100?'bad':pct>=80?'warn':'good';
  const budget=b>0?`<div class="panel"><div class="budgetrow"><h2>Monthly budget</h2><span class="sub"><b style="color:var(--ink)">${fmt(sum)}</b> of ${fmt(b)} · ${Math.round(pct)}% used</span></div><div class="prog ${tone}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${Math.min(100,pct)}%"></div></div><div class="sub">${pct>100?`Over budget by ${fmt(sum-b)} per month.`:`${fmt(b-sum)} left this month${pct>=80?' — getting close to your limit':''}.`} <a href="#" data-view="settings" style="color:var(--accent);font-weight:600">Change budget</a></div></div>`
    :`<div class="panel"><div class="budgetrow"><h2>Monthly budget</h2><button class="btn sm" data-view="settings">Set a budget</button></div><div class="sub" style="margin-top:6px">Set a monthly limit to see how your subscriptions measure up.</div></div>`;
  const p=projection(),upl=[...a].sort(byNext).slice(0,5);
  return `<div class="cards">${card('Monthly spend',fmt(sum),'Normalized monthly cost','wallet')}${card('Annual projection',fmt(sum*12),'If nothing changes','chart')}${card('Active subscriptions',a.length,`${paused} paused · ${canc} cancelled`,'check')}${card(`Renewing in ${S().remind} days`,due.length,`${fmt(dueAmt)} due`,'cal')}</div>
  ${budget}
  <div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Upcoming payments</h2><div class="sub">Scheduled charges for the next 6 months · current month counts from today</div></div></div>${barsChart(p)}</div>
  <div class="panel"><div class="panelhead"><h2>Next renewals</h2><button class="btn sm ghost" data-view="renewals">View all ${ico('right',14)}</button></div><div class="upcoming">${upl.map(upRow).join('')||'<div class="empty" style="padding:24px">No active subscriptions.</div>'}</div></div></div>
  <div class="panel"><div class="panelhead"><div><h2>Recently added</h2><div class="sub">Click any row to edit it</div></div><button class="btn sm ghost" data-view="subscriptions">View all ${ico('right',14)}</button></div>${table([...state.subs].sort((a,b)=>b.id-a.id).slice(0,5),{select:false})}</div>`};

function filtered(){const q=ui.q.trim().toLowerCase();let l=state.subs.filter(s=>(ui.cat==='all'||s.category===ui.cat)&&(ui.status==='all'||(ui.status==='Due soon'?(s.status==='Active'&&dd(s.next)<=S().remind):s.status===ui.status))&&(!q||[s.name,s.owner,s.category,s.notes].join(' ').toLowerCase().includes(q)));
  const rank=s=>s.status==='Active'?0:s.status==='Paused'?1:2;
  const sorts={next:(a,b)=>rank(a)-rank(b)||byNext(a,b),name:(a,b)=>a.name.localeCompare(b.name),high:(a,b)=>mon(b)-mon(a),low:(a,b)=>mon(a)-mon(b),new:(a,b)=>b.id-a.id};
  return l.sort(sorts[ui.sort])}
V.subscriptions=()=>`<div class="panel"><div class="panelhead"><div><h2>All subscriptions</h2><div class="sub" id="subsCount"></div></div><div class="toolbar"><label class="searchbox">${ico('search',16)}<input id="q" type="search" placeholder="Search…  ( / )" value="${esc(ui.q)}" aria-label="Search subscriptions"></label>
<select id="fcat" aria-label="Category"><option value="all">All categories</option>${CATS.map(c=>`<option ${ui.cat===c?'selected':''}>${c}</option>`).join('')}</select>
<select id="fstatus" aria-label="Status">${['all','Active','Due soon','Paused','Cancelled'].map(s=>`<option value="${s}" ${ui.status===s?'selected':''}>${s==='all'?'All statuses':s}</option>`).join('')}</select>
<select id="fsort" aria-label="Sort by">${[['next','Sort: Next payment'],['name','Sort: Name'],['high','Sort: Cost (high → low)'],['low','Sort: Cost (low → high)'],['new','Sort: Recently added']].map(([v,l])=>`<option value="${v}" ${ui.sort===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div id="bulk"></div><div id="subsTable"></div></div>`;
function bulkHTML(){for(const id of [...sel])if(!find(id))sel.delete(id);if(!sel.size)return'';return `<div class="bulk"><b>${sel.size} selected</b><button class="btn sm" data-act="bulk-Active">${ico('play',13)}Set active</button><button class="btn sm" data-act="bulk-Paused">${ico('pause',13)}Pause</button><button class="btn sm" data-act="bulk-Cancelled">${ico('ban',13)}Cancel</button><button class="btn sm danger" data-act="bulk-del">${ico('trash',13)}Delete</button><button class="btn sm ghost" data-act="bulk-clear">Clear</button></div>`}

const csvCell=x=>{let v=typeof x==='string'&&/^[=+\-@]/.test(x)?"'"+x:String(x??'');return '"'+v.replace(/"/g,'""')+'"'};
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportCSV(){const rows=[['Name','Category','Amount','Currency','Billing cycle','Next payment','Owner','Status','Notes'],...state.subs.map(s=>[s.name,s.category,s.amount,S().currency,s.cycle,s.next,s.owner,s.status,s.notes||''])];
  download(`subtrack-subscriptions-${todayS()}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');toast('CSV exported')}
function exportJSON(){download(`subtrack-backup-${todayS()}.json`,JSON.stringify({app:'subtrack-pro',version:2,settings:state.settings,subs:state.subs},null,2),'application/json');toast('Backup downloaded')}
function parseCSV(t){t=t.replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
function normalize(x){const name=String(x.name??'').replace(/^'(?=[=+\-@])/,'').trim().slice(0,80),amount=Number(x.amount);if(!name||!(amount>0))return null;
  const cyc=String(x.cycle||'monthly').toLowerCase(),st=String(x.status||'Active').toLowerCase();
  return{name,category:CATS.find(c=>c.toLowerCase()===String(x.category||'').toLowerCase())||'Other',amount,cycle:CYCLES[cyc]?cyc:'monthly',next:/^\d{4}-\d{2}-\d{2}$/.test(x.next||'')?x.next:addDays(todayS(),30),owner:String(x.owner||'').slice(0,60),status:STATUSES.find(s=>s.toLowerCase()===st)||'Active',notes:String(x.notes||'').slice(0,400),sample:false}}
async function importFile(file){try{const text=await file.text();let items=[];
  if(/\.json$/i.test(file.name)){const j=JSON.parse(text);items=(Array.isArray(j)?j:j.subs||[]).map(normalize)}
  else{const rows=parseCSV(text),h=rows.shift().map(x=>x.trim().toLowerCase()),col=n=>h.indexOf(n);items=rows.map(r=>normalize({name:r[col('name')],category:r[col('category')],amount:r[col('amount')],cycle:r[col('billing cycle')],next:r[col('next payment')],owner:r[col('owner')],status:r[col('status')],notes:r[col('notes')]}))}
  items=items.filter(Boolean);if(!items.length){toast('No valid subscriptions found in that file');return}
  commit(`Imported ${items.length} subscription${items.length>1?'s':''}`,()=>{let id=newId();items.forEach(x=>state.subs.push({id:id++,...x}))})}catch(e){toast('Could not read that file')}}

function markPaid(id){const s=find(id);if(!s)return;commit(`Marked “${s.name}” as paid — next payment ${dfmt(shift(s.next,s.cycle,1))}`,()=>{s.next=shift(s.next,s.cycle,1)})}
function del(id){const s=find(id);if(!s)return;closeModal();commit(`Deleted “${s.name}”`,()=>{state.subs=state.subs.filter(x=>x.id!==id);sel.delete(id)})}
function bulk(kind){const ids=[...sel];if(!ids.length)return;
  if(kind==='del')commit(`Deleted ${ids.length} subscription${ids.length>1?'s':''}`,()=>{state.subs=state.subs.filter(s=>!sel.has(s.id));sel.clear()});
  else commit(`${ids.length} subscription${ids.length>1?'s':''} set to ${kind}`,()=>{state.subs.forEach(s=>{if(sel.has(s.id)){s.status=kind;s.sample=false}});sel.clear()})}

document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){e.preventDefault();return nav(v.dataset.view)}
  const a=e.target.closest('[data-act]');
  if(a){const id=+a.dataset.id,k=a.dataset.act;
    if(k.startsWith('bulk-'))return k==='bulk-clear'?(sel.clear(),fillSubs()):bulk(k.slice(5));
    switch(k){
      case'add':return editor();
      case'edit':return editor(id);
      case'dup':{const s=find(id);return editor(null,{...s,name:s.name+' (copy)',sample:false})}
      case'del':return del(id);
      case'paid':e.stopPropagation();return markPaid(id);
      case'close-modal':return closeModal();
      case'theme-toggle':return setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
      case'theme':return setTheme(a.dataset.v);
      case'export-csv':return exportCSV();
      case'export-json':return exportJSON();
      case'import':return $('file').click();
      case'clear-sample':return commit('Sample data removed',()=>{state.subs=state.subs.filter(s=>!s.sample);sel.clear()});
      case'restore-sample':return commit('Sample data loaded',()=>{let n=newId();sampleData().forEach(s=>state.subs.push({...s,id:n++}))});
      case'clear-all':return commit('All subscriptions deleted',()=>{state.subs=[];sel.clear()});
      case'clear-filters':ui.q='';ui.cat='all';ui.status='all';return render();
      case'range':ui.range=+a.dataset.n;return render();
      case'cal-prev':ui.cal=new Date(ui.cal.getFullYear(),ui.cal.getMonth()-1,1);return render();
      case'cal-next':ui.cal=new Date(ui.cal.getFullYear(),ui.cal.getMonth()+1,1);return render();
      case'cal-today':{const d=new Date();ui.cal=new Date(d.getFullYear(),d.getMonth(),1);return render()}
      case'upgrade':return toast('Demo checkout only — connect a payment provider to activate billing.');
    }}
  const tr=e.target.closest('tr[data-row]');if(tr&&!e.target.closest('button,input,label,a'))editor(+tr.dataset.row)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.matches('[data-chk]')){t.checked?sel.add(+t.dataset.chk):sel.delete(+t.dataset.chk);return fillSubs()}
  if(t.matches('[data-chkall]')){filtered().forEach(s=>t.checked?sel.add(s.id):sel.delete(s.id));return fillSubs()}
  if(t.id==='fcat'){ui.cat=t.value;return fillSubs()}if(t.id==='fstatus'){ui.status=t.value;return fillSubs()}if(t.id==='fsort'){ui.sort=t.value;return fillSubs()}
  if(t.id==='file'){if(t.files[0])importFile(t.files[0]);t.value='';return}
  if(t.dataset.set){const k=t.dataset.set;let v=t.value;if(k==='budget')v=Math.max(0,Number(v)||0);if(k==='remind')v=Number(v);if(k==='workspace')v=v.trim()||DEFAULTS.workspace;S()[k]=v;persist();render();toast('Settings saved')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;fillSubs()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('modal').innerHTML)return closeModal();
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$('modal').innerHTML;if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();if(ui.view!=='subscriptions')nav('subscriptions');$('q')?.focus()}
  else if(e.key.toLowerCase()==='n'&&!['pricing','settings'].includes(ui.view)){e.preventDefault();editor()}});

/* tooltips */
const tipEl=$('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tipEl.style.display='none';return}const [h,...r]=t.dataset.tip.split('|');tipEl.innerHTML=`<b>${esc(h)}</b>${r.map(x=>`<div>${esc(x)}</div>`).join('')}`;tipEl.style.display='block';mv(e)});
document.addEventListener('mousemove',e=>{if(tipEl.style.display==='block')mv(e)});
document.addEventListener('scroll',()=>tipEl.style.display='none',true);
function mv(e){const w=tipEl.offsetWidth,h=tipEl.offsetHeight;tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,e.clientX+14))+'px';tipEl.style.top=Math.max(8,Math.min(innerHeight-h-8,e.clientY+16))+'px'}

buildShell();applyTheme();persist();render();
})();
</script>
</body>
</html>
